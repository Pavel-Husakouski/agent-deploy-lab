name: agent-deploy-lab

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: agent-deploy-lab:local
    init: true
    environment:
      # Ключ берётся из окружения пользователя или из .env рядом с этим файлом.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?задайте DEEPSEEK_API_KEY в окружении или в .env}
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
