name: agent-deploy-lab

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:26-slim
    working_dir: /app
    init: true
    command: ["sh", "scripts/compose-api.sh"]
    environment:
      # Ключ берётся из окружения пользователя или из .env рядом с этим файлом.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?задайте DEEPSEEK_API_KEY в окружении или в .env}
      REDIS_URL: redis://redis:6379
      MODEL_ID: ${MODEL_ID:-deepseek-chat}
      TEMPERATURE: ${TEMPERATURE:-0.3}
      MAX_TOKENS: ${MAX_TOKENS:-1024}
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - api-node-modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  api-node-modules:
