# Корневой Application (app-of-apps): рендерит chart deploy/apps, тот создаёт Application на
# каждый компонент стенда. make up применяет этот файл и подставляет ветку в targetRevision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Pavel-Husakouski/agent-deploy-lab.git
    targetRevision: main
    path: deploy/apps
    helm:
      valuesObject:
        targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
