# kind-кластер стенда: одна нода, NodePort-сервисы проброшены на localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agent-deploy-lab
nodes:
  - role: control-plane
    extraPortMappings:
      # agent API: CLI ходит на localhost:13000 без изменений
      - containerPort: 30000
        hostPort: 13000
        listenAddress: 127.0.0.1
      # Argo CD UI
      - containerPort: 30080
        hostPort: 18080
        listenAddress: 127.0.0.1
      # Prometheus UI
      - containerPort: 30090
        hostPort: 19090
        listenAddress: 127.0.0.1
