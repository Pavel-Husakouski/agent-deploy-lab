apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://langfuse.github.io/langfuse-k8s
    chart: langfuse
    targetRevision: {{ .Values.charts.langfuse }}
    helm:
      # Все секреты создаёт make secret: под Argo CD helm lookup не видит кластер, и
      # сгенерированные chart значения менялись бы на каждом sync.
      valuesObject:
        langfuse:
          image:
            pullPolicy: IfNotPresent
          salt:
            secretKeyRef: { name: langfuse-keys, key: salt }
          encryptionKey:
            secretKeyRef: { name: langfuse-keys, key: encryption-key }
          nextauth:
            url: http://localhost:13300
            secret:
              secretKeyRef: { name: langfuse-keys, key: nextauth-secret }
          features:
            telemetryEnabled: false
            signUpDisabled: true
          # Headless init: org, project с API-ключами для LiteLLM и агента, пользователь UI.
          additionalEnvFrom:
            - secretRef:
                name: langfuse-init
          web:
            service:
              type: NodePort
              nodePort: 30300
            resources:
              requests: { cpu: 100m, memory: 512Mi }
              limits: { memory: 1536Mi }
          worker:
            # Фоновые циклы, которые стенду не нужны: мониторы, проверка in-app агента,
            # батч-удаление trace, метрики очередей, relay audit log. Ingestion не трогаем.
            pod:
              additionalEnv:
                - { name: LANGFUSE_MONITOR_SCHEDULER_ENABLED, value: "false" }
                - { name: LANGFUSE_IN_APP_AGENT_INTEGRITY_RUNNER_ENABLED, value: "false" }
                - { name: LANGFUSE_TRACE_DELETE_BATCH_ACTION_RUNNER_ENABLED, value: "false" }
                - { name: LANGFUSE_QUEUE_METRICS_ENABLED, value: "false" }
                - { name: LANGFUSE_AUDIT_LOG_RELAY_ENABLED, value: "false" }
            resources:
              requests: { cpu: 100m, memory: 384Mi }
              limits: { memory: 1Gi }
        postgresql:
          auth:
            existingSecret: langfuse-postgresql-auth
            secretKeys:
              userPasswordKey: USERDB_PASSWORD
              adminPasswordKey: POSTGRES_PASSWORD
          storage:
            requestedSize: 2Gi
          # Пробы chart — exec pg_isready, на одном узле хватит раза в 30 с.
          livenessProbe:
            periodSeconds: 30
          readinessProbe:
            periodSeconds: 30
        redis:
          auth:
            existingSecret: langfuse-redis-auth
            existingSecretPasswordKey: default
          dataStorage:
            requestedSize: 1Gi
        # Свой ClickHouse из deploy/langfuse, без operator и Keeper.
        clickhouse:
          deploy: false
          host: clickhouse
          auth:
            username: clickhouse
            existingSecret: langfuse-clickhouse-auth
            existingSecretKey: password
          cluster:
            enabled: false
        s3:
          auth:
            existingSecret: langfuse-s3-auth
            rootUserSecretKey: accessKey
            rootPasswordSecretKey: secretKey
          allInOne:
            data:
              size: 2Gi
            resources:
              requests: { cpu: 100m, memory: 256Mi }
              limits: { memory: 1Gi }
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
