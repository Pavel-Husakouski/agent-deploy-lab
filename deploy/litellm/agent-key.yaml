# Virtual key агента с бюджетом. Значение ключа генерирует make secret (Secret litellm),
# Job только регистрирует его в LiteLLM после каждого sync. Повторный /key/generate с тем же
# ключом перезаписал бы его без лимитов, поэтому сначала проверка /key/info.
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-agent-key
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: curlimages/curl:8.17.0
          env:
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: LITELLM_MASTER_KEY
            - name: AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: AGENT_KEY
            # Бюджет на 30 дней в долларах. Урезать для проверки: make llm-budget BUDGET=0.
            - name: MAX_BUDGET
              value: "1"
          command:
            - sh
            - -ec
            - |
              url=http://litellm:4000
              until curl -sf "$url/health/readiness" >/dev/null; do sleep 3; done
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url/key/info?key=$AGENT_KEY" \
                -H "authorization: Bearer $MASTER_KEY")
              if [ "$code" = 200 ]; then echo "ключ агента уже есть"; exit 0; fi
              [ "$code" = 404 ] || { echo "key/info ответил $code" >&2; exit 1; }
              curl -sf "$url/key/generate" -o /dev/null \
                -H "authorization: Bearer $MASTER_KEY" -H 'content-type: application/json' \
                -d "{\"key\":\"$AGENT_KEY\",\"key_alias\":\"agent\",\"models\":[\"deepseek-flash\"],\"max_budget\":$MAX_BUDGET,\"budget_duration\":\"30d\"}"
              echo "ключ агента создан"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
