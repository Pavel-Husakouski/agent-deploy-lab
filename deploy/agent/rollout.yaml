# API агента. Rollout вместо Deployment: canary steps и анализ добавит этап 6.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  strategy:
    canary: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "13000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: agent-deploy-lab
          # Имя и тег из GHCR подставляет kustomization.yaml, теги неизменяемы (версия + sha).
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 13000
          env:
            - name: PORT
              value: "13000"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  # Секрет создаёт make up из переменной окружения, в git его нет.
                  name: deepseek
                  key: DEEPSEEK_API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          # /healthz отдаёт 503 без Redis: для liveness это не повод перезапускать под.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
