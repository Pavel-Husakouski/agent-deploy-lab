# API агента. Rollout вместо Deployment: новая версия выкатывается canary с анализом метрик.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
spec:
  # Без ingress-контроллера трафик делится числом подов: 2 реплики дают шаг 50%.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  strategy:
    canary:
      # Анализ идёт фоном с первого шага. Провал прерывает выкатку: canary масштабируется в
      # 0, весь трафик остаётся на stable. Первый деплой canary не проходит, он сразу 100%.
      analysis:
        templates:
          - templateName: agent-canary
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
          - name: stable-hash
            valueFrom:
              podTemplateHashValue: Stable
      steps:
        - setWeight: 50
        # За 5 минут анализ успевает сделать 4–5 измерений.
        - pause: { duration: 5m }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "13000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: agent-deploy-lab
          # Имя и тег из GHCR подставляет kustomization.yaml, теги неизменяемы (версия + sha).
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 13000
          # Контракт тенанта llm-platform: LLM_BASE_URL и LLM_API_KEY (virtual key LiteLLM с
          # бюджетом), LANGFUSE_HOST и ключи проекта Langfuse агента для score на trace, который
          # пишет LiteLLM. Секрет создаёт make tenant, в git его нет.
          envFrom:
            - secretRef:
                name: platform-llm
          env:
            - name: PORT
              value: "13000"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: LLM_METADATA
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          # /healthz отдаёт 503 без Redis: для liveness это не повод перезапускать под.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
