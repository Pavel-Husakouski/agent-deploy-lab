apiVersion: v1
kind: Service
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: agent
  ports:
    - name: http
      port: 13000
      targetPort: http
      # kind пробрасывает 30000 на localhost:13000
      nodePort: 30000
