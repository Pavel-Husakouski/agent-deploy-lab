apiVersion: v1
kind: Service
metadata:
  name: agent-deploy-lab
  labels:
    app.kubernetes.io/name: agent-deploy-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: agent-deploy-lab
  ports:
    - name: http
      port: 13000
      targetPort: http
      # API на IP хоста k3s: http://<HOST>:30000
      nodePort: 30000
