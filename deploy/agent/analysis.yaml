# Анализ canary: метрики пода новой версии сравниваются с подом stable, а не с историческим
# baseline. Поды различает метка rollouts_pod_template_hash, которую Prometheus платформы
# берёт из labels пода. Без трафика запросы дают NaN: ни success, ни failure не выполняется,
# измерение Inconclusive, и Rollout встаёт на паузу вместо выкатки вслепую (npm run load).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: agent-canary
spec:
  args:
    - name: canary-hash
    - name: stable-hash
  metrics:
    # Доля ответов с ошибкой у canary минус та же доля у stable. Ошибки валидации и
    # конфликты сессии (400, 409) — ошибки клиента, в знаменатель не входят.
    - name: error-rate-diff
      initialDelay: 1m
      interval: 1m
      failureLimit: 1
      successCondition: result[0] <= 0.05
      failureCondition: result[0] > 0.05
      provider:
        prometheus:
          address: http://prometheus-server.monitoring:9090
          query: |
            (
              sum(rate(agent_chat_requests_total{namespace="agent",rollouts_pod_template_hash="{{args.canary-hash}}",status="error"}[2m]) or vector(0))
              / sum(rate(agent_chat_requests_total{namespace="agent",rollouts_pod_template_hash="{{args.canary-hash}}",status=~"ok|error|aborted"}[2m]))
            ) - (
              sum(rate(agent_chat_requests_total{namespace="agent",rollouts_pod_template_hash="{{args.stable-hash}}",status="error"}[2m]) or vector(0))
              / sum(rate(agent_chat_requests_total{namespace="agent",rollouts_pod_template_hash="{{args.stable-hash}}",status=~"ok|error|aborted"}[2m]))
            )
    # p95 длительности ответа: canary не медленнее stable больше чем вдвое. Корзины
    # гистограммы грубые (2, 5, 10 s), поэтому порог с запасом.
    - name: p95-latency-ratio
      initialDelay: 1m
      interval: 1m
      failureLimit: 1
      successCondition: result[0] <= 2
      failureCondition: result[0] > 2
      provider:
        prometheus:
          address: http://prometheus-server.monitoring:9090
          query: |
            histogram_quantile(0.95, sum by (le) (rate(agent_chat_duration_seconds_bucket{namespace="agent",rollouts_pod_template_hash="{{args.canary-hash}}",status="ok"}[2m])))
            / histogram_quantile(0.95, sum by (le) (rate(agent_chat_duration_seconds_bucket{namespace="agent",rollouts_pod_template_hash="{{args.stable-hash}}",status="ok"}[2m])))
    # Стоимость одного успешного ответа: canary дороже stable не больше чем в 1.5 раза.
    - name: cost-per-request-ratio
      initialDelay: 1m
      interval: 1m
      failureLimit: 1
      successCondition: result[0] <= 1.5
      failureCondition: result[0] > 1.5
      provider:
        prometheus:
          address: http://prometheus-server.monitoring:9090
          query: |
            (
              sum(rate(agent_llm_cost_usd_total{namespace="agent",rollouts_pod_template_hash="{{args.canary-hash}}"}[2m]))
              / sum(rate(agent_chat_requests_total{namespace="agent",rollouts_pod_template_hash="{{args.canary-hash}}",status="ok"}[2m]))
            ) / (
              sum(rate(agent_llm_cost_usd_total{namespace="agent",rollouts_pod_template_hash="{{args.stable-hash}}"}[2m]))
              / sum(rate(agent_chat_requests_total{namespace="agent",rollouts_pod_template_hash="{{args.stable-hash}}",status="ok"}[2m]))
            )
