# ClickHouse для Langfuse: трейсы, observations и scores. Один узел без Keeper и operator:
# chart Langfuse ставит ClickHouse через ClickHouse operator с cert-manager, для kind это
# три лишних компонента. Langfuse работает с ним в режиме CLICKHOUSE_CLUSTER_ENABLED=false.
#
# Профиль ClickHouse под один узел стенда. По умолчанию ClickHouse пишет в system.* метрики
# раз в секунду, сэмплы профайлера, свой лог и историю merge: в простое это ~60–100m CPU и
# сотни merge в час, при том что данных Langfuse — сотни килобайт. Оставлен только query_log
# с TTL 1 день: его читает Langfuse worker. Остальной холостой фон: 16 потоков асинхронных
# вставок и асинхронный логгер, которые просыпаются 100 раз в секунду, задачи MergeTree на
# каждую таблицу раз в секунду, пул на 512 потоков, лог уровня trace. Merge при объёме стенда
# подождут, пулы репликации, Kafka и distributed-таблиц не нужны.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  labels:
    app.kubernetes.io/name: clickhouse
data:
  low-cpu.xml: |
    <clickhouse>
      <aggregated_zookeeper_log remove="1"/>
      <asynchronous_insert_log remove="1"/>
      <asynchronous_metric_log remove="1"/>
      <background_schedule_pool_log remove="1"/>
      <backup_log remove="1"/>
      <blob_storage_log remove="1"/>
      <delta_lake_metadata_log remove="1"/>
      <error_log remove="1"/>
      <iceberg_metadata_log remove="1"/>
      <instrumentation_trace_log remove="1"/>
      <metric_log remove="1"/>
      <opentelemetry_span_log remove="1"/>
      <part_log remove="1"/>
      <processors_profile_log remove="1"/>
      <query_metric_log remove="1"/>
      <query_thread_log remove="1"/>
      <query_views_log remove="1"/>
      <text_log remove="1"/>
      <trace_log remove="1"/>
      <zookeeper_connection_log remove="1"/>
      <zookeeper_log remove="1"/>
      <query_log replace="1">
        <database>system</database>
        <table>query_log</table>
        <engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + INTERVAL 1 DAY DELETE</engine>
        <flush_interval_milliseconds>7500</flush_interval_milliseconds>
      </query_log>
      <asynchronous_metrics_update_period_s>60</asynchronous_metrics_update_period_s>
      <background_schedule_pool_size>4</background_schedule_pool_size>
      <!-- Потоки очереди асинхронных вставок (ими пишет Langfuse) и асинхронного логгера
           просыпаются 100 раз в секунду даже без работы: 16 + 2 потока давали ~17m CPU. -->
      <async_insert_threads>2</async_insert_threads>
      <background_buffer_flush_schedule_pool_size>1</background_buffer_flush_schedule_pool_size>
      <background_message_broker_schedule_pool_size>1</background_message_broker_schedule_pool_size>
      <background_distributed_schedule_pool_size>1</background_distributed_schedule_pool_size>
      <background_fetches_pool_size>1</background_fetches_pool_size>
      <background_move_pool_size>1</background_move_pool_size>
      <memory_worker_period_ms>1000</memory_worker_period_ms>
      <logger>
        <level>warning</level>
        <async>false</async>
      </logger>
      <merge_tree>
        <merge_tree_clear_old_parts_interval_seconds>30</merge_tree_clear_old_parts_interval_seconds>
        <merge_tree_clear_old_temporary_directories_interval_seconds>600</merge_tree_clear_old_temporary_directories_interval_seconds>
        <merge_selecting_sleep_ms>30000</merge_selecting_sleep_ms>
      </merge_tree>
    </clickhouse>
  users-low-cpu.xml: |
    <clickhouse>
      <profiles>
        <default>
          <query_profiler_real_time_period_ns>0</query_profiler_real_time_period_ns>
          <query_profiler_cpu_time_period_ns>0</query_profiler_cpu_time_period_ns>
        </default>
      </profiles>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
      annotations:
        # subPath не обновляется на лету: после правки clickhouse-config поднять revision.
        config/revision: "4"
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: clickhouse
          # Версия как в chart Langfuse 2.2.4 (рекомендованная для Langfuse v4).
          image: clickhouse/clickhouse-server:26.8.36.3
          env:
            - name: CLICKHOUSE_USER
              value: clickhouse
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Секреты создаёт make secret, в git их нет.
                  name: langfuse-clickhouse-auth
                  key: password
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            # Файлами через subPath, а не каталогом: entrypoint образа пишет в users.d
            # пользователя из CLICKHOUSE_USER.
            - name: config
              mountPath: /etc/clickhouse-server/config.d/low-cpu.xml
              subPath: low-cpu.xml
            - name: config
              mountPath: /etc/clickhouse-server/users.d/low-cpu.xml
              subPath: users-low-cpu.xml
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
